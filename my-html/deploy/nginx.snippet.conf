# 插入到 siliconthink 站点配置中，且必须写在 location / 之前。
# 根目录：/var/www/my-html
# 口令文件：/etc/nginx/.htpasswd-my-html  （用户 binge）
#
# 规则：
# - /my_html/f/*.html  GET 公开（扫码直达，免口令）
# - 上传 / 删除（PUT/DELETE）仍需口令
# - 上传页、列表页、manifest、JS/CSS 整站管理面需口令

# 1) 已上传 HTML：读公开，写要口令
location /my_html/f/ {
    alias /var/www/my-html/f/;
    default_type text/html;

    dav_methods PUT DELETE MKCOL;
    create_full_put_path on;
    dav_access user:rw group:rw all:r;
    client_max_body_size 2m;

    limit_except GET HEAD {
        auth_basic "my_html";
        auth_basic_user_file /etc/nginx/.htpasswd-my-html;
    }
}

# 2) 管理面（上传/列表/脚本/manifest）：全程口令
location /my_html/ {
    alias /var/www/my-html/;
    index index.html;
    auth_basic "my_html";
    auth_basic_user_file /etc/nginx/.htpasswd-my-html;

    dav_methods PUT DELETE MKCOL;
    create_full_put_path on;
    dav_access user:rw group:rw all:r;
    client_max_body_size 2m;
}
